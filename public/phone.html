<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Loans Ghana – Verify MTN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            padding: 1.5rem;
        }
        .phone-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 2.8rem 2.5rem 2.8rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12);
            text-align: center;
            transition: transform 0.25s ease;
        }
        .phone-card:hover { transform: translateY(-4px); }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #5b6f7e;
            text-decoration: none;
            margin-bottom: 1.2rem;
        }
        .back-link:hover { color: #1a7f5c; }
        .back-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .brand-mini .brand-name { font-size: 1.6rem; font-weight: 700; color: #0b2b3b; }
        .brand-mini .brand-name span { color: #1a7f5c; }
        .brand-mini .brand-tagline { font-size: 0.8rem; font-weight: 500; color: #5b6f7e; margin-top: 0.05rem; }
        .divider { width: 60px; height: 3px; background: linear-gradient(90deg, #1a7f5c, #3baa7a); border-radius: 4px; margin: 1rem auto 1.6rem; }
        .step-heading h2 { font-size: 1.4rem; font-weight: 700; color: #0b2b3b; margin-bottom: 0.3rem; }
        .step-heading p { font-size: 0.95rem; color: #4a6376; line-height: 1.5; max-width: 300px; margin: 0 auto 0.4rem; }
        .input-group { margin-top: 1.8rem; text-align: left; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #1f3a4a; margin-bottom: 0.5rem; }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .input-wrapper:focus-within { border-color: #1a7f5c; background: #ffffff; box-shadow: 0 0 0 4px rgba(26, 127, 92, 0.12); }
        .input-wrapper .prefix { font-size: 0.95rem; font-weight: 600; color: #1f3a4a; background: #e4e9ef; padding: 0.3rem 0.9rem; border-radius: 40px; margin-right: 0.5rem; }
        .input-wrapper input { flex: 1; border: none; background: transparent; font-size: 1.1rem; font-weight: 500; padding: 0.9rem 0.6rem 0.9rem 0.2rem; outline: none; color: #0b2b3b; font-family: 'Inter', sans-serif; width: 100%; }
        .input-wrapper input::placeholder { color: #a8bccd; font-weight: 400; font-size: 0.95rem; }
        .validation-feedback { min-height: 1.8rem; margin-top: 0.6rem; font-size: 0.85rem; font-weight: 500; display: flex; align-items: center; gap: 0.4rem; padding-left: 0.3rem; }
        .validation-feedback .error-msg { color: #c0392b; display: flex; align-items: center; gap: 0.3rem; }
        .validation-feedback .success-msg { color: #1a7f5c; display: flex; align-items: center; gap: 0.3rem; }
        .validation-feedback .hidden { display: none; }
        .btn-check {
            display: block;
            width: 100%;
            background: #1a7f5c;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(26, 127, 92, 0.30);
            margin-top: 1.8rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-check:hover:not(:disabled) { background: #146a4b; transform: scale(1.01); }
        .btn-check:disabled { background: #b0c4d4; box-shadow: none; cursor: not-allowed; opacity: 0.7; transform: none; }
        .footer-note { margin-top: 2rem; font-size: 0.75rem; color: #8a9caa; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        @media (max-width: 480px) {
            .phone-card { padding: 2rem 1.5rem 2rem; border-radius: 2rem; }
            .brand-mini .brand-name { font-size: 1.4rem; }
            .step-heading h2 { font-size: 1.2rem; }
            .input-wrapper { padding: 0.1rem 0.1rem 0.1rem 0.8rem; }
            .input-wrapper .prefix { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
            .input-wrapper input { font-size: 1rem; padding: 0.7rem 0.4rem; }
            .btn-check { font-size: 1rem; padding: 0.8rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="phone-card">
        <a href="index.html" class="back-link"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" /></svg> Back</a>
        <div class="brand-mini">
            <div class="brand-name">Easy <span>Loans</span> Ghana</div>
            <div class="brand-tagline">• verify your number •</div>
        </div>
        <div class="divider"></div>
        <div class="step-heading">
            <h2>📱 Enter your MTN number</h2>
            <p>We'll check your eligibility and show your loan limit.</p>
        </div>
        <div class="input-group">
            <label>MTN Mobile Number <span class="asterisk">*</span></label>
            <div class="input-wrapper">
                <span class="prefix">+233</span>
                <input type="tel" id="mtnInput" placeholder="24 000 0000" inputmode="numeric" autocomplete="tel" />
            </div>
            <div class="validation-feedback" id="feedback">
                <span class="hidden error-msg" id="errorMsg"><span class="icon">✕</span> <span id="errorText">Invalid MTN number</span></span>
                <span class="hidden success-msg" id="successMsg"><span class="icon">✓</span> <span>Valid MTN number</span></span>
                <span id="defaultHint" style="color: #8a9caa; font-weight: 400;">e.g. 024 123 4567</span>
            </div>
        </div>
        <button class="btn-check" id="checkBtn" disabled>Check My Limit</button>
        <div class="footer-note"><span>🔒 Secure</span> <span class="dot">•</span> <span>⚡ Instant check</span> <span class="dot">•</span> <span>🇬🇭 MTN Ghana</span></div>
    </div>
    <script>
        (function() {
            const input = document.getElementById('mtnInput');
            const checkBtn = document.getElementById('checkBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const defaultHint = document.getElementById('defaultHint');
            const errorText = document.getElementById('errorText');
            const VALID_PREFIXES = ['024', '025', '054', '055', '059'];

            function isValidMtnNumber(value) {
                const digits = value.replace(/\D/g, '');
                if (digits.length !== 10) return false;
                return VALID_PREFIXES.includes(digits.substring(0, 3));
            }

            function formatMtnDisplay(value) {
                const digits = value.replace(/\D/g, '');
                if (digits.length <= 3) return digits;
                if (digits.length <= 6) return digits.slice(0, 3) + ' ' + digits.slice(3);
                return digits.slice(0, 3) + ' ' + digits.slice(3, 6) + ' ' + digits.slice(6, 10);
            }

            function updateValidationWithDigits(digits) {
                errorMsg.classList.add('hidden');
                successMsg.classList.add('hidden');
                defaultHint.style.display = 'block';
                if (digits.length === 0) { checkBtn.disabled = true; defaultHint.style.display = 'block'; return; }
                const valid = isValidMtnNumber(digits);
                if (valid) {
                    errorMsg.classList.add('hidden');
                    successMsg.classList.remove('hidden');
                    defaultHint.style.display = 'none';
                    checkBtn.disabled = false;
                } else {
                    successMsg.classList.add('hidden');
                    errorMsg.classList.remove('hidden');
                    defaultHint.style.display = 'none';
                    if (digits.length !== 10) errorText.textContent = `Must be 10 digits (currently ${digits.length})`;
                    else if (!VALID_PREFIXES.includes(digits.substring(0, 3))) errorText.textContent = `Must start with ${VALID_PREFIXES.join(', ')}`;
                    else errorText.textContent = 'Invalid MTN number';
                    checkBtn.disabled = true;
                }
            }

            function handleInput() {
                let raw = input.value;
                let digits = raw.replace(/\D/g, '');
                if (digits.length > 10) digits = digits.slice(0, 10);
                input.value = digits.length > 0 ? formatMtnDisplay(digits) : '';
                updateValidationWithDigits(digits);
            }

            input.addEventListener('input', handleInput);
            input.addEventListener('paste', () => setTimeout(handleInput, 0));
            input.addEventListener('blur', handleInput);

            checkBtn.addEventListener('click', function() {
                const digits = input.value.replace(/\D/g, '');
                if (isValidMtnNumber(digits)) {
                    window.location.href = 'limit.html';
                } else {
                    // This should not happen if button is disabled, but just in case.
                }
            });

            input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !checkBtn.disabled) checkBtn.click(); });
            checkBtn.disabled = true;
            defaultHint.style.display = 'block';
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            input.focus();
        })();
    </script>
</body>
</html>
