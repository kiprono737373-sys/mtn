<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Loan Offer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            padding: 1.5rem;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            padding: 2.8rem 2.5rem 2.8rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12);
            text-align: center;
            transition: transform 0.25s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 500; color: #5b6f7e; text-decoration: none; margin-bottom: 1.2rem; }
        .back-link:hover { color: #1a7f5c; }
        .back-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .brand-mini .brand-name { font-size: 1.6rem; font-weight: 700; color: #0b2b3b; }
        .brand-mini .brand-name span { color: #1a7f5c; }
        .brand-mini .brand-tagline { font-size: 0.8rem; font-weight: 500; color: #5b6f7e; margin-top: 0.05rem; }
        .divider { width: 60px; height: 3px; background: linear-gradient(90deg, #1a7f5c, #3baa7a); border-radius: 4px; margin: 1rem auto 1.6rem; }
        .qualification { background: #ecfdf3; border: 1px solid #abf0d1; border-radius: 16px; padding: 1rem 1.2rem; margin-bottom: 1.8rem; display: flex; align-items: center; gap: 0.75rem; text-align: left; }
        .qualification .icon { font-size: 1.8rem; }
        .qualification p { font-size: 0.95rem; color: #0b2b3b; font-weight: 500; }
        .qualification p strong { color: #1a7f5c; font-weight: 700; }
        .amount-display-wrapper { margin: 0.5rem 0 0.8rem; }
        .amount-display { font-size: 2.8rem; font-weight: 700; color: #0b2b3b; background: #f1f5f9; padding: 0.5rem 1rem; border-radius: 60px; display: inline-block; min-width: 200px; }
        .amount-display span { color: #1a7f5c; }
        .custom-amount-group { margin: 0.8rem 0 1.2rem; text-align: left; }
        .custom-amount-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #1f3a4a; margin-bottom: 0.4rem; }
        .custom-amount-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 60px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .custom-amount-group input:focus { border-color: #1a7f5c; box-shadow: 0 0 0 4px rgba(26,127,92,0.12); }
        .custom-amount-group input.error { border-color: #c0392b; }
        .custom-error { font-size: 0.75rem; color: #c0392b; margin-top: 0.3rem; padding-left: 0.5rem; min-height: 1.2rem; }
        .period-selector { margin: 0.5rem 0 0.8rem; padding: 0.2rem; background: #f1f5f9; border-radius: 60px; display: flex; width: 100%; border: 1px solid #e2e8f0; flex-wrap: wrap; }
        .period-option { flex: 1 1 0; min-width: 70px; text-align: center; padding: 0.5rem 0.1rem; border-radius: 40px; font-weight: 600; font-size: 0.85rem; color: #5b6f7e; cursor: pointer; transition: all 0.25s ease; background: transparent; border: none; font-family: 'Inter', sans-serif; }
        .period-option.active { background: #ffffff; color: #1a7f5c; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
        .period-option input[type="radio"] { display: none; }
        .period-option .period-label { pointer-events: none; }
        .period-option .sub-text { font-size: 0.6rem; font-weight: 400; color: #8a9caa; display: block; margin-top: 0.05rem; pointer-events: none; }
        .period-option.active .sub-text { color: #5b6f7e; }
        .results-card { background: #f8fafc; border-radius: 20px; padding: 1.2rem 1.5rem; margin: 1.2rem 0 0.8rem; text-align: left; border: 1px solid #e9edf2; }
        .result-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.95rem; color: #1f3a4a; border-bottom: 1px dashed #e2e8f0; }
        .result-row:last-child { border-bottom: none; }
        .result-row .label { font-weight: 500; color: #5b6f7e; }
        .result-row .value { font-weight: 600; color: #0b2b3b; }
        .result-row.total { margin-top: 0.3rem; padding-top: 0.8rem; border-top: 2px solid #dce3ea; border-bottom: none; }
        .result-row.total .label { font-weight: 700; color: #0b2b3b; font-size: 1rem; }
        .result-row.total .value { font-weight: 700; color: #1a7f5c; font-size: 1.1rem; }
        .interest-note { font-size: 0.75rem; color: #8a9caa; text-align: center; margin-top: 0.3rem; }
        .btn-continue {
            display: block;
            width: 100%;
            background: #1a7f5c;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(26, 127, 92, 0.30);
            margin-top: 1.8rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-continue:hover { background: #146a4b; transform: scale(1.01); }
        .footer-note { margin-top: 2rem; font-size: 0.75rem; color: #8a9caa; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem 2rem; border-radius: 2rem; }
            .brand-mini .brand-name { font-size: 1.4rem; }
            .amount-display { font-size: 2.2rem; min-width: 150px; padding: 0.4rem 0.8rem; }
            .btn-continue { font-size: 1rem; padding: 0.8rem 1.2rem; }
            .qualification p { font-size: 0.85rem; }
            .result-row { font-size: 0.85rem; }
            .period-option { font-size: 0.75rem; padding: 0.4rem 0.1rem; min-width: 60px; }
            .period-option .sub-text { font-size: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="phone.html" class="back-link"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" /></svg> Back</a>
        <div class="brand-mini">
            <div class="brand-name">Loan <span>Service</span></div>
            <div class="brand-tagline">• your personalized offer •</div>
        </div>
        <div class="divider"></div>
        <div class="qualification">
            <span class="icon">✅</span>
            <p>Your loan limit is <strong id="limitAmountText">ZMW 0</strong>.</p>
        </div>
        <div class="amount-display-wrapper">
            <div class="amount-display" id="amountDisplay">ZMW <span id="amountValue">0</span></div>
        </div>

        <!-- Custom amount input -->
        <div class="custom-amount-group">
            <label for="customAmount">Want a lower amount? Enter it here (ZMW)</label>
            <input type="number" id="customAmount" min="500" step="100" placeholder="e.g. 2000" />
            <div class="custom-error" id="customError"></div>
        </div>

        <div class="period-selector" id="periodSelector">
            <label class="period-option active" data-period="1"><input type="radio" name="repaymentPeriod" value="1" checked /><span class="period-label">1 Month</span><span class="sub-text">5% fee</span></label>
            <label class="period-option" data-period="3"><input type="radio" name="repaymentPeriod" value="3" /><span class="period-label">3 Months</span><span class="sub-text">12% fee</span></label>
            <label class="period-option" data-period="6"><input type="radio" name="repaymentPeriod" value="6" /><span class="period-label">6 Months</span><span class="sub-text">22% fee</span></label>
            <label class="period-option" data-period="12"><input type="radio" name="repaymentPeriod" value="12" /><span class="period-label">12 Months</span><span class="sub-text">40% fee</span></label>
        </div>

        <div class="results-card">
            <div class="result-row"><span class="label">Loan Amount</span><span class="value" id="principalDisplay">ZMW 0</span></div>
            <div class="result-row"><span class="label">Interest</span><span class="value" id="interestDisplay">ZMW 0</span></div>
            <div class="result-row total"><span class="label">Total Payable</span><span class="value" id="totalDisplay">ZMW 0</span></div>
        </div>
        <div class="interest-note" id="rateNote">* Interest rate: 5% flat for 1 month.</div>
        <button class="btn-continue" id="continueBtn">Apply for ZMW 0</button>
        <div class="footer-note"><span>🔒 Secure</span> <span class="dot">•</span> <span>⚡ Flexible terms</span> <span class="dot">•</span> <span>🇿🇲 Zambia</span></div>
    </div>
    <script>
        (function() {
            const amountValue = document.getElementById('amountValue');
            const principalDisplay = document.getElementById('principalDisplay');
            const interestDisplay = document.getElementById('interestDisplay');
            const totalDisplay = document.getElementById('totalDisplay');
            const continueBtn = document.getElementById('continueBtn');
            const rateNote = document.getElementById('rateNote');
            const periodOptions = document.querySelectorAll('.period-option');
            const limitAmountText = document.getElementById('limitAmountText');
            const customAmountInput = document.getElementById('customAmount');
            const customError = document.getElementById('customError');

            const RATES = { '1': 0.05, '3': 0.12, '6': 0.22, '12': 0.40 };
            const MIN_AMOUNT = 500;

            // Generate a random loan limit between 3,500 and 20,000 ZMW (multiples of 100)
            const minLimit = 3500;
            const maxLimit = 20000;   // <-- changed from 30000
            const steps = (maxLimit - minLimit) / 100; // 165
            const randomLimit = minLimit + Math.floor(Math.random() * (steps + 1)) * 100;
            const loanLimit = Math.min(maxLimit, Math.max(minLimit, randomLimit));

            let currentPeriod = '1';
            let currentAmount = loanLimit; // default to max limit

            // Set initial displays
            limitAmountText.textContent = `ZMW ${loanLimit.toLocaleString()}`;
            amountValue.textContent = loanLimit.toLocaleString();
            principalDisplay.textContent = `ZMW ${loanLimit.toLocaleString()}`;
            customAmountInput.placeholder = `Max ${loanLimit.toLocaleString()}`;

            function updatePage() {
                const rate = RATES[currentPeriod];
                const interest = currentAmount * rate;
                const total = currentAmount + interest;

                amountValue.textContent = currentAmount.toLocaleString();
                principalDisplay.textContent = `ZMW ${currentAmount.toLocaleString()}`;
                interestDisplay.textContent = `ZMW ${interest.toLocaleString()}`;
                totalDisplay.textContent = `ZMW ${total.toLocaleString()}`;
                continueBtn.textContent = `Apply for ZMW ${currentAmount.toLocaleString()}`;

                const periodText = currentPeriod === '1' ? '1 month' : currentPeriod + ' months';
                const ratePercent = (rate * 100).toFixed(0);
                rateNote.textContent = `* Interest rate: ${ratePercent}% flat for ${periodText}.`;
            }

            // Handle custom amount input
            function handleCustomAmount() {
                const raw = customAmountInput.value.trim();
                customError.textContent = '';

                if (raw === '') {
                    // Reset to max limit
                    customAmountInput.classList.remove('error');
                    currentAmount = loanLimit;
                    updatePage();
                    return;
                }

                const value = Number(raw);
                if (isNaN(value) || value < MIN_AMOUNT) {
                    customAmountInput.classList.add('error');
                    customError.textContent = `Amount must be at least ZMW ${MIN_AMOUNT}.`;
                    return;
                }

                if (value > loanLimit) {
                    customAmountInput.classList.add('error');
                    customError.textContent = `Amount cannot exceed your limit of ZMW ${loanLimit.toLocaleString()}.`;
                    return;
                }

                // Valid
                customAmountInput.classList.remove('error');
                currentAmount = value;
                updatePage();
            }

            customAmountInput.addEventListener('input', handleCustomAmount);
            customAmountInput.addEventListener('blur', function() {
                // If empty on blur, reset to limit
                if (this.value.trim() === '') {
                    this.value = '';
                    currentAmount = loanLimit;
                    updatePage();
                }
            });

            // Period selection
            periodOptions.forEach(option => {
                option.addEventListener('click', function(e) {
                    if (this.classList.contains('active')) return;
                    periodOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    currentPeriod = this.querySelector('input[type="radio"]').value;
                    updatePage();
                });
            });

            continueBtn.addEventListener('click', function() {
                window.location.href = 'terms.html';
            });

            updatePage();
        })();
    </script>
</body>
</html>
