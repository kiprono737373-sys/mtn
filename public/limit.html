<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Loans Ghana – Select Limit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            padding: 1.5rem;
        }
        .card {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 2.8rem 2.5rem 2.8rem;
            border-radius: 2.5rem;
            box-shadow: 0 20px 60px rgba(0, 20, 30, 0.12);
            text-align: center;
            transition: transform 0.25s ease;
        }
        .card:hover { transform: translateY(-4px); }
        .back-link { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 500; color: #5b6f7e; text-decoration: none; margin-bottom: 1.2rem; }
        .back-link:hover { color: #1a7f5c; }
        .back-link svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .brand-mini .brand-name { font-size: 1.6rem; font-weight: 700; color: #0b2b3b; }
        .brand-mini .brand-name span { color: #1a7f5c; }
        .brand-mini .brand-tagline { font-size: 0.8rem; font-weight: 500; color: #5b6f7e; margin-top: 0.05rem; }
        .divider { width: 60px; height: 3px; background: linear-gradient(90deg, #1a7f5c, #3baa7a); border-radius: 4px; margin: 1rem auto 1.6rem; }
        .qualification { background: #ecfdf3; border: 1px solid #abf0d1; border-radius: 16px; padding: 1rem 1.2rem; margin-bottom: 1.8rem; display: flex; align-items: center; gap: 0.75rem; text-align: left; }
        .qualification .icon { font-size: 1.8rem; }
        .qualification p { font-size: 0.95rem; color: #0b2b3b; font-weight: 500; }
        .qualification p strong { color: #1a7f5c; font-weight: 700; }
        .amount-display-wrapper { margin: 0.5rem 0 1.2rem; }
        .amount-display { font-size: 2.8rem; font-weight: 700; color: #0b2b3b; background: #f1f5f9; padding: 0.5rem 1rem; border-radius: 60px; display: inline-block; min-width: 200px; }
        .amount-display span { color: #1a7f5c; }
        .slider-container { padding: 0.5rem 0.2rem 0.5rem; }
        .slider-labels { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 500; color: #5b6f7e; margin-top: 0.3rem; }
        input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 6px; background: #dce3ea; outline: none; margin: 1rem 0 0.2rem; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #1a7f5c; cursor: pointer; margin-top: -9px; box-shadow: 0 2px 8px rgba(26, 127, 92, 0.4); }
        input[type="range"]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #1a7f5c; cursor: pointer; border: none; box-shadow: 0 2px 8px rgba(26, 127, 92, 0.4); }
        .period-selector { margin: 0.5rem 0 0.8rem; padding: 0.2rem; background: #f1f5f9; border-radius: 60px; display: inline-flex; width: 100%; border: 1px solid #e2e8f0; }
        .period-option { flex: 1; text-align: center; padding: 0.6rem 0.2rem; border-radius: 40px; font-weight: 600; font-size: 0.95rem; color: #5b6f7e; cursor: pointer; transition: all 0.25s ease; background: transparent; border: none; font-family: 'Inter', sans-serif; }
        .period-option.active { background: #ffffff; color: #1a7f5c; box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06); }
        .period-option input[type="radio"] { display: none; }
        .period-option .period-label { pointer-events: none; }
        .period-option .sub-text { font-size: 0.65rem; font-weight: 400; color: #8a9caa; display: block; margin-top: 0.05rem; pointer-events: none; }
        .period-option.active .sub-text { color: #5b6f7e; }
        .results-card { background: #f8fafc; border-radius: 20px; padding: 1.2rem 1.5rem; margin: 1.2rem 0 0.8rem; text-align: left; border: 1px solid #e9edf2; }
        .result-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.95rem; color: #1f3a4a; border-bottom: 1px dashed #e2e8f0; }
        .result-row:last-child { border-bottom: none; }
        .result-row .label { font-weight: 500; color: #5b6f7e; }
        .result-row .value { font-weight: 600; color: #0b2b3b; }
        .result-row.total { margin-top: 0.3rem; padding-top: 0.8rem; border-top: 2px solid #dce3ea; border-bottom: none; }
        .result-row.total .label { font-weight: 700; color: #0b2b3b; font-size: 1rem; }
        .result-row.total .value { font-weight: 700; color: #1a7f5c; font-size: 1.1rem; }
        .interest-note { font-size: 0.75rem; color: #8a9caa; text-align: center; margin-top: 0.3rem; }
        .btn-continue {
            display: block;
            width: 100%;
            background: #1a7f5c;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.25s ease, transform 0.15s ease;
            box-shadow: 0 8px 24px rgba(26, 127, 92, 0.30);
            margin-top: 1.8rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-continue:hover { background: #146a4b; transform: scale(1.01); }
        .footer-note { margin-top: 2rem; font-size: 0.75rem; color: #8a9caa; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        @media (max-width: 480px) {
            .card { padding: 2rem 1.5rem 2rem; border-radius: 2rem; }
            .brand-mini .brand-name { font-size: 1.4rem; }
            .amount-display { font-size: 2.2rem; min-width: 150px; padding: 0.4rem 0.8rem; }
            .btn-continue { font-size: 1rem; padding: 0.8rem 1.2rem; }
            .qualification p { font-size: 0.85rem; }
            .result-row { font-size: 0.85rem; }
            .period-option { font-size: 0.85rem; padding: 0.5rem 0.1rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <a href="phone.html" class="back-link"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7" /></svg> Back</a>
        <div class="brand-mini">
            <div class="brand-name">Easy <span>Loans</span> Ghana</div>
            <div class="brand-tagline">• choose your amount & period •</div>
        </div>
        <div class="divider"></div>
        <div class="qualification">
            <span class="icon"></span>
            <p>You qualify for a loan amount between <strong>GHS 500</strong> and <strong>GHS 20,000</strong>.</p>
        </div>
        <div class="amount-display-wrapper">
            <div class="amount-display" id="amountDisplay">GHS <span id="amountValue">500</span></div>
        </div>
        <div class="slider-container">
            <input type="range" id="limitSlider" min="500" max="20000" value="500" step="100" />
            <div class="slider-labels"><span>GHS 500</span><span>GHS 20,000</span></div>
        </div>
        <div class="period-selector" id="periodSelector">
            <label class="period-option active" data-period="1"><input type="radio" name="repaymentPeriod" value="1" checked /><span class="period-label">1 Month</span><span class="sub-text">5% fee</span></label>
            <label class="period-option" data-period="3"><input type="radio" name="repaymentPeriod" value="3" /><span class="period-label">3 Months</span><span class="sub-text">12% fee</span></label>
        </div>
        <div class="results-card">
            <div class="result-row"><span class="label">Loan Amount</span><span class="value" id="principalDisplay">GHS 500</span></div>
            <div class="result-row"><span class="label">Interest</span><span class="value" id="interestDisplay">GHS 25</span></div>
            <div class="result-row total"><span class="label">Total Payable</span><span class="value" id="totalDisplay">GHS 525</span></div>
        </div>
        <div class="interest-note" id="rateNote">* Interest rate: 5% flat for 1 month.</div>
        <button class="btn-continue" id="continueBtn">Apply for GHS 500</button>
        <div class="footer-note"><span>🔒 Secure</span> <span class="dot">•</span> <span>⚡ Flexible terms</span> <span class="dot">•</span> <span>🇬🇭 Easy Loans</span></div>
    </div>
    <script>
        (function() {
            const slider = document.getElementById('limitSlider');
            const amountValue = document.getElementById('amountValue');
            const principalDisplay = document.getElementById('principalDisplay');
            const interestDisplay = document.getElementById('interestDisplay');
            const totalDisplay = document.getElementById('totalDisplay');
            const continueBtn = document.getElementById('continueBtn');
            const rateNote = document.getElementById('rateNote');
            const periodOptions = document.querySelectorAll('.period-option');
            const RATES = { '1': 0.05, '3': 0.12 };
            let currentPeriod = '1';

            function updatePage() {
                const amount = parseInt(slider.value);
                const rate = RATES[currentPeriod];
                const interest = amount * rate;
                const total = amount + interest;
                amountValue.textContent = amount.toLocaleString();
                principalDisplay.textContent = `GHS ${amount.toLocaleString()}`;
                interestDisplay.textContent = `GHS ${interest.toLocaleString()}`;
                totalDisplay.textContent = `GHS ${total.toLocaleString()}`;
                continueBtn.textContent = `Apply for GHS ${amount.toLocaleString()}`;
                const periodText = currentPeriod === '1' ? '1 month' : '3 months';
                const ratePercent = (rate * 100).toFixed(0);
                rateNote.textContent = `* Interest rate: ${ratePercent}% flat for ${periodText}.`;
            }

            periodOptions.forEach(option => {
                option.addEventListener('click', function(e) {
                    if (this.classList.contains('active')) return;
                    periodOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    currentPeriod = this.querySelector('input[type="radio"]').value;
                    updatePage();
                });
            });

            slider.addEventListener('input', updatePage);

            continueBtn.addEventListener('click', function() {
                // Redirect to terms page
                window.location.href = 'terms.html';
            });

            slider.addEventListener('keydown', function(e) { if (e.key === 'Enter') continueBtn.click(); });
            updatePage();
        })();
    </script>
</body>
</html>
